format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

# Mirror of the config stored on bitrise.io for the app (the app does NOT read it from the repo).

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: elite

trigger_map:
- push_branch: "*"
  workflow: selective_tests
- pull_request_target_branch: main
  workflow: selective_tests

workflows:
  # Baseline: every package's tests. Compare its Test Reports with selective_tests.
  full_tests:
    steps:
    - git-clone@8: {}
    - flutter-installer@0:
        inputs:
        - is_update: "false"
    - script@1:
        title: Run every package's tests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            for d in packages/core packages/networking packages/feature app; do
              (cd "$d" && flutter test)
            done
    - deploy-to-bitrise-io@2: {}

  # Branch build of Flutter Test: reads test-selection.json itself, skips when nothing is selected.
  selective_tests:
    steps:
    - git-clone@8: {}
    - flutter-installer@0:
        inputs:
        - is_update: "false"
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        # Push builds have no BITRISEIO_GIT_BRANCH_DEST; diff against main explicitly.
        - base_ref: main
        - project_type: flutter
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/bitrise-step-flutter-test.git@test-selection:
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/app
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
    - script@1:
        title: Show selection
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -n "${BITRISE_TEST_SELECTION_PATH:-}" ]; then cat "$BITRISE_TEST_SELECTION_PATH"; fi
    - deploy-to-bitrise-io@2: {}

  # Shadow release check: the backend config injected as a workflow env, the test steps from their
  # test-selection-shadow branches. Every test runs; each step writes test-selection.json.
  shadow_tests:
    envs:
    - BITRISE_TEST_SELECTION_CONFIG_JSON: '{"mode":"shadow","base_ref":"main"}'
    steps:
    - git-clone@8: {}
    - flutter-installer@0:
        inputs:
        - is_update: 'false'
    - git::https://github.com/bitrise-steplib/bitrise-step-flutter-test.git@test-selection-shadow:
        title: Flutter Test app (shadow branch)
        inputs:
        - project_location: "$BITRISE_SOURCE_DIR/app"
    - git::https://github.com/bitrise-steplib/bitrise-step-flutter-test.git@test-selection-shadow:
        title: Flutter Test core (shadow branch)
        inputs:
        - project_location: "$BITRISE_SOURCE_DIR/packages/core"
    - script@1:
        title: Show shadow reports
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            find "$BITRISE_TEST_DEPLOY_DIR" -name test-selection.json | sort | while read -r f; do echo "== $f"; cat "$f"; echo; done
    - deploy-to-bitrise-io@2: {}
